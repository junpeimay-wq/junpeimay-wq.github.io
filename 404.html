<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません</title>
  <script>
    (function () {
      var path = location.pathname;
      if (path !== "/games" && path.indexOf("/games/") !== 0) {
        return;
      }
      var base = "https://junpeimay-games.web.app";
      var destPath = path.slice("/games".length) || "/";
      location.replace(base + destPath + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <main>
    <p>ページが見つかりません。</p>
  </main>
</body>
</html>
